[workspace]
resolver = "3"
# The soak test's counting allocator is a package of its own: the only code
# here that implements an unsafe trait (see its Cargo.toml).
members = ["crates/*", "crates/solouder-bench/count-alloc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Zlib"
repository = "https://github.com/GabaCool-Games/SoLouder"
readme = "README.md"
keywords = ["audio", "soloud", "mixer", "gamedev", "sound"]
categories = ["multimedia::audio", "game-development"]

# Versions pinned for later milestones (CPAL output, decoders, Bevy) live here
# so every crate that adopts them agrees. Unused entries cost nothing.
[workspace.dependencies]
solouder-core = { path = "crates/solouder-core", version = "0.1.0" }
solouder-decoders = { path = "crates/solouder-decoders", version = "0.1.0" }
solouder-sources = { path = "crates/solouder-sources", version = "0.1.0" }
solouder-cpal = { path = "crates/solouder-cpal", version = "0.1.0" }
bevy = { version = "0.20", default-features = false }
cpal = "0.18"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

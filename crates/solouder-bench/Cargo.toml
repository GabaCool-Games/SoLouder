[package]
name = "solouder-bench"
description = "Render-time benchmarks and a multi-threaded soak test for SoLouder (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
solouder-core.workspace = true
solouder-decoders.workspace = true
solouder-sources = { workspace = true, optional = true }

[features]
# The generated sources' cases and soak plays (solouder-sources).
sources = ["dep:solouder-sources"]

[dev-dependencies]
# The soak test's counting allocator, kept out of this crate so that it
# forbids unsafe code like the rest of the workspace.
solouder-count-alloc = { path = "count-alloc" }

[lints]
workspace = true

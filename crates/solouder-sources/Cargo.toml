[package]
name = "solouder-sources"
description = "SoLouder sources: SoLoud's generators (noise, sfxr, chip music, speech) for solouder-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ay", "monotone", "noise", "sfxr", "tedsid", "vic"]
# WELL512, shared by noise and sfxr.
prg = []
ay = ["chipdump"]
monotone = []
noise = ["prg"]
sfxr = ["prg"]
tedsid = ["chipdump"]
vic = []
# Chip register dumps and zx7, shared by tedsid and ay.
chipdump = []

[dependencies]
solouder-core.workspace = true

[dev-dependencies]
stats_alloc = "0.1"

[lints]
workspace = true

[package]
name = "solouder-sources"
description = "SoLouder sources: SoLoud's generators (noise, sfxr, chip music, speech, vizsn) for solouder-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ay", "monotone", "noise", "sfxr", "speech", "tedsid", "vic", "vizsn"]
# WELL512, shared by noise and sfxr.
prg = []
ay = ["chipdump"]
monotone = []
noise = ["prg"]
sfxr = ["prg"]
speech = []
tedsid = ["chipdump"]
vic = []
vizsn = []
# Chip register dumps and zx7, shared by tedsid and ay.
chipdump = []

[dependencies]
solouder-core.workspace = true

[dev-dependencies]
stats_alloc = "0.1"

[[test]]
name = "realtime_no_alloc"
required-features = ["ay", "monotone", "noise", "sfxr", "speech", "tedsid", "vic", "vizsn"]

[lints]
workspace = true

name: CI

# Windows renders the golden C++ output (MSVC); Linux and macOS compare Rust
# with it, and Linux also with its own GCC build of the reference. See
# docs/port-status.md, "Support matrix", for what each job verifies.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: Miri.
    - cron: "17 3 * * *"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/fetch_reference.py
      - run: python scripts/check_all.py --reference --parity
      # The golden output the other platforms compare against.
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-windows
          path: build/parity/cpp
          if-no-files-found: error

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      # CPAL's ALSA backend links against libasound on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/fetch_reference.py
      # Rust against this machine's GCC build of the reference, within the
      # `gcc` tolerances of tests/scenarios/tolerances.txt.
      - run: python scripts/check_all.py --reference --parity --parity-profile gcc
      # Rust on Linux against the Windows output: exact unless `cross`
      # declares otherwise.
      - uses: actions/download-artifact@v4
        with:
          name: cpp-windows
          path: build/parity/windows
      - run: python scripts/run_parity.py --cpp-dir build/parity/windows --profile cross

  linux-device:
    runs-on: ubuntu-latest
    # A PulseAudio null sink through ALSA's pulse plugin. Each stream there
    # reports a transient snd_pcm_avail_delay I/O error, which Output::state
    # treats as final (docs/port-status.md, "Support matrix"), so this job
    # reports without failing the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pulseaudio libasound2-plugins
      - uses: Swatinem/rust-cache@v2
      - name: Start PulseAudio with a null sink
        run: |
          pulseaudio -D --exit-idle-time=-1
          sleep 2
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
      - run: cargo test -p solouder-cpal --test device_lifecycle -- --test-threads=1
        env:
          SOLOUDER_REQUIRE_DEVICE: "1"
      - run: cargo test -p bevy_solouder --test plugin_lifecycle
        env:
          SOLOUDER_REQUIRE_DEVICE: "1"

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/fetch_reference.py
      - run: cargo test --workspace
      # The reference's own regression tests. Its parity output is not
      # compared: Apple's compiler and libm are neither MSVC nor GCC.
      - run: python scripts/test_reference.py
      - uses: actions/download-artifact@v4
        with:
          name: cpp-windows
          path: build/parity/windows
      # Rust on macOS (arm64) against the Windows output. Not yet run on a
      # Mac: until a run records which scenarios differ there (and the
      # `cross` profile declares them), this step reports without failing.
      - run: python scripts/run_parity.py --cpp-dir build/parity/windows --profile cross
        continue-on-error: true

  # Each crate builds on its own (no features unified from the rest of the
  # workspace) and without default features. Crates with optional features
  # add a line per feature (see docs/port-status.md, "Support matrix").
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - -p solouder-core --no-default-features
          - -p solouder-decoders --no-default-features
          - -p solouder-cpal --no-default-features
          - -p bevy_solouder --no-default-features
          - -p solouder-parity
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
      - run: cargo check --all-targets ${{ matrix.args }}

  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      # The DSP kernels and the visualization triple buffer; the other
      # real-time tests mix seconds of audio, too slow under Miri.
      - run: "cargo +nightly miri test -p solouder-core --lib -- dsp:: realtime::visual"

name: CI

# Windows renders the golden C++ output (MSVC); Linux and macOS compare Rust
# with it, and Linux also with its own GCC build of the reference. See
# docs/port-status.md, "Support matrix", for what each job verifies.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: Miri.
    - cron: "17 3 * * *"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/fetch_reference.py
      - run: python scripts/check_all.py --reference --parity
      # The golden output the other platforms compare against.
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-windows
          path: build/parity/cpp
          if-no-files-found: error

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      # CPAL's ALSA backend links against libasound on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/fetch_reference.py
      # Rust against this machine's GCC build of the reference, within the
      # `gcc` tolerances of tests/scenarios/tolerances.txt.
      - run: python scripts/check_all.py --reference --parity --parity-profile gcc
      # Rust on Linux against the Windows output: exact unless `cross`
      # declares otherwise.
      - uses: actions/download-artifact@v4
        with:
          name: cpp-windows
          path: build/parity/windows
      - run: python scripts/run_parity.py --cpp-dir build/parity/windows --profile cross

  linux-device:
    runs-on: ubuntu-latest
    # A PulseAudio null sink through ALSA's pulse plugin. Each stream there
    # reports a transient snd_pcm_avail_delay I/O error, which Output::state
    # treats as final (docs/port-status.md, "Support matrix"), so this job
    # reports without failing the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pulseaudio libasound2-plugins
      - uses: Swatinem/rust-cache@v2
      - name: Start PulseAudio with a null sink
        run: |
          pulseaudio -D --exit-idle-time=-1
          sleep 2
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
      - run: cargo test -p solouder-cpal --test device_lifecycle -- --test-threads=1
        env:
          SOLOUDER_REQUIRE_DEVICE: "1"
      - run: cargo test -p bevy_solouder --test plugin_lifecycle
        env:
          SOLOUDER_REQUIRE_DEVICE: "1"

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/fetch_reference.py
      - run: cargo test --workspace
      # The reference's own regression tests. Its parity output is not
      # compared: Apple's compiler and libm are neither MSVC nor GCC.
      - run: python scripts/test_reference.py
      - uses: actions/download-artifact@v4
        with:
          name: cpp-windows
          path: build/parity/windows
      # Rust on macOS (arm64) against the Windows output. Not yet run on a
      # Mac: until a run records which scenarios differ there (and the
      # `cross` profile declares them), this step reports without failing.
      - run: python scripts/run_parity.py --cpp-dir build/parity/windows --profile cross
        continue-on-error: true

  # Each crate builds on its own (no features unified from the rest of the
  # workspace) and without default features. Crates with optional features
  # add a line per feature (see docs/port-status.md, "Platforms").
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - -p solouder-core --no-default-features
          - -p solouder-decoders --no-default-features
          - -p solouder-cpal --no-default-features
          - -p bevy_solouder --no-default-features
          - -p solouder-sources --no-default-features
          - -p solouder-sources --no-default-features --features ay
          - -p solouder-sources --no-default-features --features monotone
          - -p solouder-sources --no-default-features --features noise
          - -p solouder-sources --no-default-features --features sfxr
          - -p solouder-sources --no-default-features --features speech
          - -p solouder-sources --no-default-features --features tedsid
          - -p solouder-sources --no-default-features --features vic
          - -p solouder-sources --no-default-features --features vizsn
          - -p solouder-parity
          - -p solouder-bench
          - -p solouder-bench --features sources
          - --workspace --all-features
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
      - run: cargo check --all-targets ${{ matrix.args }}

  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      # The DSP kernels, the value types, the visualization data and triple
      # buffer, and the controller/renderer tests (queues, ID pools,
      # retirement, routing): about 20 minutes. The stream, spatial and
      # layout tests mix seconds of audio, too slow under Miri.
      - run: >-
          cargo +nightly miri test -p solouder-core --lib --
          dsp:: contracts:: playback::visualization realtime::visual
          realtime::tests realtime::routing_tests
      # The generated sources' unit tests (41 of 59, under 10 minutes; they
      # read fixtures, hence no isolation). Speech, and the tests that render
      # or fuzz whole files, are too slow under Miri.
      - run: >-
          cargo +nightly miri test -p solouder-sources --lib --
          chipdump:: prg:: ay:: monotone:: noise:: sfxr:: tedsid:: vic:: vizsn::
          --skip damaged_dumps_never_panic --skip arbitrary_text_never_panics
          --skip every_prefix --skip fixtures_load_and_play --skip any_cells_render
          --skip extreme_settings --skip fixtures_load_with_their_models
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # The soak test for ten minutes in release (check_all runs three seconds).
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p solouder-bench --features sources --test soak -- --nocapture
        env:
          SOLOUDER_SOAK_SECONDS: "600"
